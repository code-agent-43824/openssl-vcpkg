name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variant:
    name: ${{ matrix.arch }} ${{ matrix.linkage }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
        # static: <arch>-windows-static; dll-mt: the overlay triplets in triplets/
        linkage: [static, dll-mt]
    uses: ./.github/workflows/build-and-test.yml
    with:
      arch: ${{ matrix.arch }}
      linkage: ${{ matrix.linkage }}

  release:
    # Publishes one release per openssl port version and release/revision; reruns skip it.
    needs: variant
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: openssl-*
          path: artifacts

      - name: Prepare release files
        id: prep
        run: ./release/prepare.sh artifacts dist >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          TAG: ${{ steps.prep.outputs.tag }}
          TITLE: ${{ steps.prep.outputs.title }}
        run: |
          cat dist/notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, not publishing."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file dist/notes.md dist/*.zip dist/SHA256SUMS
