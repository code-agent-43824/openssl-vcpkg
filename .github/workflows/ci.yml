name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

# One job per variant rather than a matrix: each gets its own build -> smoke card in the run
# graph, where a matrix of reusable-workflow calls is drawn as a single list. Each variant's
# smoke job waits only for its own build.
# linkage: static is <arch>-windows-static; dll-mt is the overlay triplet in triplets/.
jobs:
  x86-static:
    name: x86 static
    uses: ./.github/workflows/build-and-test.yml
    with: {arch: x86, linkage: static}

  x86-dll-mt:
    name: x86 dll-mt
    uses: ./.github/workflows/build-and-test.yml
    with: {arch: x86, linkage: dll-mt}

  x64-static:
    name: x64 static
    uses: ./.github/workflows/build-and-test.yml
    with: {arch: x64, linkage: static}

  x64-dll-mt:
    name: x64 dll-mt
    uses: ./.github/workflows/build-and-test.yml
    with: {arch: x64, linkage: dll-mt}

  arm64-static:
    name: arm64 static
    uses: ./.github/workflows/build-and-test.yml
    with: {arch: arm64, linkage: static}

  arm64-dll-mt:
    name: arm64 dll-mt
    uses: ./.github/workflows/build-and-test.yml
    with: {arch: arm64, linkage: dll-mt}

  release:
    # Publishes one release per openssl port version and release/revision; reruns skip it.
    # Lists every variant: a variant missing here could be left out of the release.
    needs: [x86-static, x86-dll-mt, x64-static, x64-dll-mt, arm64-static, arm64-dll-mt]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: openssl-*
          path: artifacts

      - name: Prepare release files
        id: prep
        run: ./release/prepare.sh artifacts dist >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          TAG: ${{ steps.prep.outputs.tag }}
          TITLE: ${{ steps.prep.outputs.title }}
        run: |
          cat dist/notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, not publishing."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file dist/notes.md dist/*.zip dist/SHA256SUMS
